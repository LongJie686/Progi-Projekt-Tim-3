services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: stemtutor_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-stemtutor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stemtutor123}
      POSTGRES_DB: ${DB_NAME:-stemtutor}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stemtutor} -d ${DB_NAME:-stemtutor}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stemtutor_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: stemtutor_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stemtutor_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: stemtutor_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stemtutor_network

  # Backend API
  backend:
    build:
      context: ./app/server
      dockerfile: Dockerfile
    container_name: stemtutor_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: postgresql://${DB_USER:-stemtutor}:${DB_PASSWORD:-stemtutor123}@postgres:5432/${DB_NAME:-stemtutor}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-change-in-production}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - stemtutor_network

  # Frontend
  frontend:
    build:
      context: ./app/client
      dockerfile: Dockerfile
    container_name: stemtutor_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
      VITE_STRIPE_PUBLIC_KEY: ${VITE_STRIPE_PUBLIC_KEY}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    networks:
      - stemtutor_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  stemtutor_network:
    driver: bridge
